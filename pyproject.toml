[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "build",
    "install",
    "log",
    ".git",
    "*.md",  # docs show intentionally bad code examples
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "D",
    "B",
    "UP",
    "SIM",
    "PL",
    "T20",
    "ERA",
    "C90",
]
ignore = [
    "D203",
    "D213",
]

[tool.ruff.lint.pylint]
max-positional-args = 3
max-args = 8  # 3 positional + keyword-only ones (AGENTS.md 4.4)
max-branches = 10
max-statements = 40

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/test/*" = ["D", "PLR2004"]
"setup.py" = ["D"]
"**/launch/*" = ["D"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [
    "overhead/overhead_core",
    "fleet/fleet_core",
    "sim/sim_core",
]
