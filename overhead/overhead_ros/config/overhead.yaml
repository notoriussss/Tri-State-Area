overhead_node:
  ros__parameters:
    camera_index: 0
    width: 1280
    height: 720
    rate_hz: 20.0
    arena_width_m: 1.165
    arena_height_m: 0.70
    cam_height_m: 1.0
    # TODO(overhead): confirm the camera is mounted directly above the red dot
    camera_center_world: [0.5825, 0.35]
    # TODO(overhead): measure delivery zone dimensions accurately
    zone_rect: [1.165, 0.27, 1.30, 0.44]
    robots: ["phineas", "ferb"]
    image_rate_hz: 5.0
    min_area_px: 150
    near_red_m: 0.17
    # Cube HSV ranges [H, S, V] (OpenCV ranges: H 0-180, S 0-255, V 0-255)
    # Red uses two hue bands spanning 0 and 180
    hsv_blue: [[100, 120, 70], [130, 255, 255]]
    hsv_yellow: [[20, 100, 100], [35, 255, 255]]
    hsv_red_1: [[0, 120, 70], [10, 255, 255]]
    hsv_red_2: [[170, 120, 70], [180, 255, 255]]
    # Triangle marker HSV ranges per robot
    # TODO(overhead): calibrate robot triangle marker colors with physical cardstock
    hsv_robot_phineas: [[40, 100, 100], [80, 255, 255]]
    hsv_robot_ferb: [[140, 100, 100], [165, 255, 255]]
