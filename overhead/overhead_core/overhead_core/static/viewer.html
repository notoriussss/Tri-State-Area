<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tri-State-Area Overhead Viewer</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 16px;
      background: #141414;
      color: #f0f0f0;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
    }
    button {
      padding: 8px 14px;
      border: 1px solid #444;
      background: #262626;
      color: #f0f0f0;
      cursor: pointer;
      border-radius: 4px;
    }
    button.active {
      background: #2563eb;
      border-color: #3b82f6;
    }
    #stats {
      font-family: monospace;
      margin-bottom: 10px;
      color: #93c5fd;
    }
    #feed {
      max-width: 100%;
      border: 1px solid #333;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="btn-raw" class="active" onclick="setView('raw')">Raw</button>
    <button id="btn-rectified" onclick="setView('rectified')">Rectified</button>
    <button id="btn-mask" onclick="setView('mask')">Mask</button>
    <button onclick="takeSnapshot()">Snapshot</button>
    <button onclick="recalibrate()">Recalibrate</button>
  </div>
  <div id="stats">FPS: -- | Cubes: 0 | Robots: 0 | Calibrated: no</div>
  <img id="feed" src="/stream/raw.mjpg" alt="Overhead stream">
  <script>
    let currentView = "raw";
    let actionNote = "";

    function setView(view) {
      currentView = view;
      document.getElementById("feed").src = "/stream/" + view + ".mjpg?t=" + Date.now();
      for (const name of ["raw", "rectified", "mask"]) {
        document.getElementById("btn-" + name).classList.toggle("active", name === view);
      }
    }

    async function takeSnapshot() {
      const resp = await fetch("/snapshot.jpg?view=" + encodeURIComponent(currentView));
      if (!resp.ok) {
        actionNote = "Snapshot failed";
        return;
      }
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "snapshot_" + currentView + ".jpg";
      link.click();
      URL.revokeObjectURL(url);
      actionNote = "Snapshot saved";
    }

    async function recalibrate() {
      const resp = await fetch("/recalibrate", { method: "POST" });
      const data = await resp.json();
      actionNote = data.calibrated ? "Recalibrated OK" : "Calibration failed";
    }

    async function pollStatus() {
      try {
        const resp = await fetch("/status");
        const s = await resp.json();
        const cal = s.calibrated ? "yes" : "no";
        const suffix = actionNote ? " | " + actionNote : "";
        document.getElementById("stats").textContent =
          "FPS: " + s.fps.toFixed(1) +
          " | Cubes: " + s.cubes +
          " | Robots: " + s.robots +
          " | Calibrated: " + cal + suffix;
      } catch (_err) {}
    }

    setInterval(pollStatus, 500);
    pollStatus();
  </script>
</body>
</html>
